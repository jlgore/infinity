[package]
name = "rap-client"
publish = true
version = "0.2.0"
documentation = "https://docs.rs/rap-client/"
description = "RAP client library: toolset discovery, tool invocation, lifecycle notifications, and callback handling."
edition = "2024"
repository = { workspace = true }
license = "Apache-2.0"

[dependencies]
rap-protocol = { path = "../rap-protocol", version = "^0.2.0" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["net"], optional = true }
hyper = { version = "1", features = ["server", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
http-body-util = { version = "0.1", optional = true }

[features]
default = ["callback-server"]
# Local HTTP callback server (hyper + tokio net). Disable for wasm targets.
callback-server = ["dep:tokio", "dep:hyper", "dep:hyper-util", "dep:http-body-util"]

# reqwest-backed clients are native-only; wasm hosts supply their own HTTP.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { workspace = true }

[lints]
workspace = true
