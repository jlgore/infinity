[package]
name = "infinity-agent-core"
publish = true
version = "0.2.0"
documentation = "https://docs.rs/infinity-agent-core/"
description = "Core time-sliced agent runtime for Infinity: event processing, threads, and tool dispatch."
edition = "2024"
repository = { workspace = true }
license = "Apache-2.0"

[dependencies]
rap-client = { path = "../rap-client", version = "^0.2.0", default-features = false }
rap-protocol = { path = "../rap-protocol", version = "^0.2.0" }
infinity-provider-protocol = { path = "../infinity-provider-protocol", version = "^0.2.0" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "time", "sync", "macros"] }
tokio-util = { version = "0.7" }
futures-util = { workspace = true }
async-trait = { workspace = true }
async-stream = "0.3"
chrono = { workspace = true }
chrono-tz = { workspace = true }
uuid = { workspace = true }
url = { workspace = true }
tracing = { workspace = true }
rhai = { workspace = true }

# wasm32 (e.g. Cloudflare Workers): JS-backed randomness and clocks.
[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { workspace = true, features = ["js"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
rhai = { workspace = true, features = ["wasm-bindgen"] }
chrono = { workspace = true, features = ["wasmbind"] }
gloo-timers = { version = "0.3", features = ["futures"] }
send_wrapper = { version = "0.6", features = ["futures"] }

[dev-dependencies]
insta = { version = "1", features = ["json", "redactions"] }
libc = "0.2"
infinity-provider-protocol = { path = "../infinity-provider-protocol", version = "^0.2.0", features = ["mock"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "test-util"] }
futures-util = { workspace = true, features = ["sink"] }

[lints]
workspace = true
